steps:
  - name: gcr.io/cloud-builders/docker
    id: backend-cache
    waitFor: ['-']
    args: [pull, 'asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-rag-backend-dev:latest']
    allowFailure: true
  - name: gcr.io/cloud-builders/docker
    id: backend
    waitFor: [backend-cache]
    args: [build, '--cache-from=asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-rag-backend-dev:latest', -t, 'asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-rag-backend-dev:${_TAG}', -f, Dockerfile, .]
  - name: gcr.io/cloud-builders/docker
    id: translation
    waitFor: ['-']
    args:
      - build
      - --build-arg=OLLAMA_IMAGE=ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
      - --build-arg=PYTHON_IMAGE=python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
      - --build-arg=TRANSLATION_MODEL=translategemma:12b
      - --build-arg=TRANSLATION_MODEL_REVISION=sha256:c2f9a9ca1ec7149f2422581c89937ab0363d9399d9355514d753ee012e99c252
      - -f
      - backend/translation_worker/Dockerfile
      - -t
      - asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-translategemma:${_TAG}
      - .
images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-rag-backend-dev:${_TAG}
  - asia-east1-docker.pkg.dev/$PROJECT_ID/haystack-dev/city-translategemma:${_TAG}
substitutions:
  _TAG: 'translation-${BUILD_ID}'
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
