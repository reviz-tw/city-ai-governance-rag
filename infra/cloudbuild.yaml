steps:
  # Reuse the previous image's dependency layers; first deployment can miss cache.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest']
    allowFailure: true
    id: 'pull-cache'
  # 1. Build Docker image for Vertex AI Search & MCP Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-backend'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}'
    id: 'push-image'

  # 3. Deploy a candidate revision. Existing traffic changes only after acceptance.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
      - '--region=${_LOCATION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--cpu-boost'
      - '--no-traffic'
      - '--tag=candidate'
      - '--timeout=1800'
      - '--concurrency=8'
      - '--env-vars-file=infra/env.dev.yaml'
      - '--set-secrets=AUTH_SESSION_SECRET=${_SESSION_SECRET}:latest,DATABASE_URL=${_DATABASE_SECRET}:latest'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_LOCATION}:${_SQL_INSTANCE}'
    id: 'deploy-cloud-run'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:${_TAG}'
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'

substitutions:
  _TAG: 'latest'
  _LOCATION: 'asia-east1'
  _REPO_NAME: 'haystack-dev'
  _IMAGE_NAME: 'city-rag-backend-dev'
  _SERVICE_NAME: 'city-rag-backend-dev'
  _SQL_INSTANCE: 'city-governance-postgres'
  _SESSION_SECRET: 'city-governance-session'
  _DATABASE_SECRET: 'city-governance-database-url'

options:
  logging: CLOUD_LOGGING_ONLY
