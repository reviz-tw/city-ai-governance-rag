# Independent private document processor. No database or session secrets.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [pull, '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling:${_CACHE_TAG}']
    allowFailure: true
  - name: gcr.io/cloud-builders/docker
    args: [build, '--cache-from=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling:${_CACHE_TAG}', -f, backend/docling_worker/Dockerfile, -t, '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling:${BUILD_ID}', -t, '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling:latest', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, deploy, '${_SERVICE_NAME}', '--image=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/city-docling:${BUILD_ID}', '--project=$PROJECT_ID', '--region=${_LOCATION}', '--no-allow-unauthenticated', '--cpu=2', '--memory=4Gi', '--concurrency=1', '--min-instances=0', '--max-instances=2', '--timeout=1800', '--set-env-vars=DOCLING_SOURCE_BUCKET=${_SOURCE_BUCKET}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        caller=$$(gcloud run services describe '${_WEB_SERVICE}' --project='$PROJECT_ID' --region='${_LOCATION}' --format='value(spec.template.spec.serviceAccountName)')
        test -n "$$caller"
        gcloud run services add-iam-policy-binding '${_SERVICE_NAME}' --project='$PROJECT_ID' --region='${_LOCATION}' --member="serviceAccount:$$caller" --role=roles/run.invoker
        url=$$(gcloud run services describe '${_SERVICE_NAME}' --project='$PROJECT_ID' --region='${_LOCATION}' --format='value(status.url)')
        echo "Docling processor ready: $$url"
        echo "Set DOCLING_SERVICE_URL on the web service after its pipeline code is deployed."
substitutions:
  _LOCATION: asia-east1
  _REPO_NAME: haystack-dev
  _SERVICE_NAME: city-docling-worker
  _WEB_SERVICE: city-rag-backend-dev
  _CACHE_TAG: latest
  _SOURCE_BUCKET: tdf-ocf-city-governance-docs
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
